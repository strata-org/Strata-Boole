name = "StrataBoole"
version = "0.1.0"
defaultTargets = ["StrataBoole"]
testDriver = "StrataBooleTest"
# #strata_gen Boole needs more stack on Linux/x86-64 than the 8 MB default.
weakLeanArgs = ["--tstack=32768"]

[[require]]
name = "Strata"
# The keynote state of Strata: main (Lean 4.31) plus strata-org/Strata#1478
# (opt-in define-fun-rec), #1480 (SMT datatypes as Lean inductives) and the fix
# for #1482 (checked and total sequence operations as one symbol), all open.
git = "https://github.com/kondylidou/Strata"
rev = "c77f116c5a5f537d65f36d08889df561a0df4636"

[[require]]
name = "smt"
# Fork of ufmg-smite/lean-smt at its v4.31 commit `9aedcbf`, plus the upstream fix
# for `reconstructSumUB` (ufmg-smite/lean-smt@76b4eea): an all-equality sum step
# proves `=`, not `≤`, and the kernel rejects whatever consumes it. Upstream has
# the fix only on Lean v4.33; drop this pin for the upstream one when we get there.
git = "https://github.com/kondylidou/lean-smt"
rev = "25e7a41"

[[lean_lib]]
name = "StrataBoole"

[[lean_lib]]
name = "StrataBooleTest"
