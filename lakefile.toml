name = "StrataBoole"
version = "0.1.0"
defaultTargets = ["StrataBoole"]
testDriver = "StrataBooleTest"
# #strata_gen Boole needs more stack on Linux/x86-64 than the 8 MB default.
weakLeanArgs = ["--tstack=32768"]

[[require]]
name = "Strata"
# The keynote state of Strata: main plus strata-org/Strata#1478 (opt-in
# define-fun-rec) and #1480 (SMT datatypes as Lean inductives), both open.
git = "https://github.com/kondylidou/Strata"
rev = "dbda7f33f83b5052ee74ec14c2984f1e409173b1"

[[require]]
name = "smt"
# Fork of ufmg-smite/lean-smt at the v4.29 pin `7d1d823`, plus the upstream fix
# for `reconstructSumUB` (ufmg-smite/lean-smt@76b4eea): an all-equality sum step
# proves `=`, not `≤`, and the kernel rejects whatever consumes it. Upstream has
# the fix on a branch that moved to Lean v4.33; drop this pin for the upstream
# one when Strata and Strata-Boole move too.
git = "https://github.com/kondylidou/lean-smt"
rev = "704d0f4"



# lean-smt requires mathlib at the tag for Lean v4.29.0, but this project (and
# Strata) are on v4.29.1, and the mathlib cache refuses a toolchain mismatch.
# The root package's pin wins, so ask for the tag that matches our toolchain.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"

[[lean_lib]]
name = "StrataBoole"

[[lean_lib]]
name = "StrataBooleTest"
