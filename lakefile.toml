name = "StrataBoole"
version = "0.1.0"
defaultTargets = ["StrataBoole"]
testDriver = "StrataBooleTest"
# #strata_gen Boole needs more stack on Linux/x86-64 than the 8 MB default.
weakLeanArgs = ["--tstack=32768"]

[[require]]
name = "Strata"
# TEMPORARY: local checkout with fix/gen-vcs-precond-termcheck (Core.genVCs runs termCheck +
# precondElim). Switch back to git/main once strata-org/Strata merges it.
path = "/Users/kondylidou/Developer/Strata"

[[require]]
name = "smt"
git = "https://github.com/ufmg-smite/lean-smt"
rev = "7d1d823"


[[lean_lib]]
name = "StrataBoole"

[[lean_lib]]
name = "StrataBooleTest"
