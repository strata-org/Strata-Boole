name = "StrataBoole"
version = "0.1.0"
defaultTargets = ["StrataBoole"]
testDriver = "StrataBooleTest"
# #strata_gen Boole needs more stack on Linux/x86-64 than the 8 MB default.
weakLeanArgs = ["--tstack=32768"]

[[require]]
name = "Strata"
# TEMPORARY: fork branch with strata-org/Strata#1471 (Core.genVCs runs the termCheck +
# precondElim phases). Switch back to git/main + `lake update Strata` once #1471 is merged.
git = "https://github.com/kondylidou/Strata"
rev = "fix/gen-vcs-precond-termcheck"

[[require]]
name = "smt"
git = "https://github.com/ufmg-smite/lean-smt"
rev = "7d1d823"


[[lean_lib]]
name = "StrataBoole"

[[lean_lib]]
name = "StrataBooleTest"
