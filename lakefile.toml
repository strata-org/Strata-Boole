name = "StrataBoole"
version = "0.1.0"
defaultTargets = ["StrataBoole"]
testDriver = "StrataBooleTest"
# #strata_gen Boole needs more stack on Linux/x86-64 than the 8 MB default.
weakLeanArgs = ["--tstack=32768"]

[[require]]
name = "Strata"
# INTEGRATION (local): ../Strata on branch keynote-pin = Strata main + #1478 + #1471.
# Replace with git = kondylidou/Strata, rev = keynote-pin once that branch is pushed.
path = "../Strata"

[[require]]
name = "smt"
git = "https://github.com/ufmg-smite/lean-smt"
rev = "7d1d823"


[[lean_lib]]
name = "StrataBoole"

[[lean_lib]]
name = "StrataBooleTest"
