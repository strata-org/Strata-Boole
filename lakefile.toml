name = "StrataBoole"
version = "0.1.0"
defaultTargets = ["StrataBoole"]
testDriver = "StrataBooleTest"
# #strata_gen Boole needs more stack on Linux/x86-64 than the 8 MB default.
weakLeanArgs = ["--tstack=32768"]

[[require]]
name = "Strata"
# On this branch Strata is the `integration/lean-route` branch of the fork: Strata main
# plus the open PRs the Lean route needs (datatype denotation, checked-to-total sequence
# pass, public denote lemmas, datatypes to Lean). It moves back to strata-org/Strata when
# they merge. A fixed commit, not a branch name, so `lake update` cannot move it.
git = "https://github.com/kondylidou/Strata"
rev = "f8be6585b"

[[require]]
name = "smt"
git = "https://github.com/ufmg-smite/lean-smt"
rev = "db545bebe"


[[lean_lib]]
name = "StrataBoole"

[[lean_lib]]
name = "StrataBooleTest"
